<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Hors ligne · Kryptonews</title>
  <meta name="theme-color" content="#16130f">
  <style>
    :root { color-scheme: light dark; --paper: #f3eee3; --ink: #16130f; --soft: #4a4338; --accent: #b8360f; }
    @media (prefers-color-scheme: dark) { :root { --paper: #141210; --ink: #efe7d6; --soft: #c9bfac; --accent: #ff8a5c; } }
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100dvh; display: grid; place-items: center; padding: 1.5rem; background: var(--paper); color: var(--ink); font-family: Georgia, 'Times New Roman', serif; }
    main { max-width: 34rem; text-align: center; display: grid; gap: 1.1rem; }
    .logo { font-family: 'Old English Text MT', 'UnifrakturMaguntia', Georgia, serif; font-size: clamp(2.6rem, 12vw, 4.5rem); line-height: 1; }
    .rule { height: 7px; border-top: 3px solid var(--ink); border-bottom: 1px solid var(--ink); }
    .stamp { justify-self: center; padding: .3em .8em; border: 2px solid var(--accent); color: var(--accent); font: 800 .8rem/1 Arial, sans-serif; letter-spacing: .16em; text-transform: uppercase; transform: rotate(-4deg); }
    h1 { font-size: clamp(1.6rem, 6vw, 2.2rem); }
    p { color: var(--soft); font-size: 1.1rem; line-height: 1.5; }
    a { display: inline-block; justify-self: center; padding: .8rem 1.4rem; border: 2px solid var(--ink); background: var(--ink); color: var(--paper); font: 700 .85rem/1 Arial, sans-serif; letter-spacing: .08em; text-transform: uppercase; text-decoration: none; }
    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">Kryptonews</div>
    <div class="rule"></div>
    <span class="stamp">Hors ligne · Offline</span>
    <h1>Les rotatives attendent le réseau</h1>
    <p>Vous n’êtes pas connecté à Internet. Les cours et les titres reviennent dès que la connexion est rétablie.</p>
    <p lang="en">You are offline. Prices and headlines come back as soon as the connection does.</p>
    <a href="/">Réessayer · Try again</a>
  </main>
</body>
</html>
